<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: linear-gradient(135deg, #4F46E5 0%, #1E1B4B 100%);
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  /* Subtle background pattern */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 80%, rgba(245,158,11,0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(79,70,229,0.15) 0%, transparent 50%);
  }
  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }
  .logo-mark {
    width: 96px;
    height: 96px;
  }
  .logo-mark svg { width: 100%; height: 100%; }
  .text-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .title {
    font-size: 52px;
    font-weight: 800;
    color: #FFFFFF;
    letter-spacing: -0.02em;
  }
  .subtitle {
    font-size: 22px;
    font-weight: 400;
    color: rgba(255,255,255,0.65);
    letter-spacing: 0.02em;
  }
  .arabic {
    font-size: 28px;
    font-weight: 500;
    color: rgba(255,255,255,0.5);
    margin-top: 4px;
  }
  .accent-line {
    position: absolute;
    bottom: 48px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 4px;
    border-radius: 2px;
    background: #F59E0B;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="logo-mark">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="og" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#4F46E5"/>
            <stop offset="100%" stop-color="#1E1B4B"/>
          </linearGradient>
        </defs>
        <circle cx="24" cy="26" r="14" fill="white"/>
        <circle cx="18" cy="8" r="3" fill="white"/>
        <circle cx="30" cy="8" r="3" fill="white"/>
        <path d="M38 26 C42 26, 44 30, 40 34" stroke="white" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
    <div class="text-group">
      <div class="title">Qawam</div>
      <div class="subtitle">HR & Payroll System</div>
      <div class="arabic">قَوام</div>
    </div>
    <div class="accent-line"></div>
  </div>
</body>
</html>
