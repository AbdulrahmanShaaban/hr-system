version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qawam
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.6
    environment:
      MEILI_MASTER_KEY: qawam-dev-key
    ports:
      - "7700:7700"
    volumes:
      - meilidata:/meili_data

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/qawam
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MEILISEARCH_HOST: meilisearch
      MEILISEARCH_PORT: 7700
      MEILISEARCH_API_KEY: qawam-dev-key
      JWT_SECRET: qawam-dev-jwt-secret
      JWT_REFRESH_SECRET: qawam-dev-refresh-secret
    depends_on:
      - postgres
      - redis
      - meilisearch

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000

volumes:
  pgdata:
  meilidata:
